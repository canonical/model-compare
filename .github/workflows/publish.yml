name: publish

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Test
        run: |
          python -m pip install pytest
          pytest

      - name: Build site
        env:
          AA_API_KEY: ${{ secrets.AA_API_KEY }}
        run: |
          mkdir -p _site
          python model_compare.py --best > best.txt
          for p in balanced price quality; do
            python model_compare.py --priority "$p" --json --top 10 > "$p.json"
          done
          python model_compare.py --catalog > catalog.json
          python build_site_data.py \
            --best-file best.txt \
            --output _site/data.json \
            --catalog-file catalog.json \
            --priority balanced=balanced.json \
            --priority price=price.json \
            --priority quality=quality.json
          cp best.txt site/index.html _site/

      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
